<svg xmlns="http://www.w3.org/2000/svg" width="200" height="64" viewBox="0 0 200 64">
  <!-- Poça encaixada no chão: a linha y=16 coincide com o topo da grama. -->
  <defs>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6df"/>
      <stop offset="0.22" stop-color="#9fcfcb"/>
      <stop offset="0.62" stop-color="#6aa5a6"/>
      <stop offset="1" stop-color="#3f7a80"/>
    </linearGradient>
    <linearGradient id="lama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c6141"/>
      <stop offset="1" stop-color="#a8774f"/>
    </linearGradient>
    <linearGradient id="superficie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3f1ea" stop-opacity="0.15"/>
      <stop offset="0.35" stop-color="#f4fbf6" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#e3f1ea" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e3f1ea" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Terra úmida em volta, escurecendo a borda da cova. -->
  <path d="M3 16C10 29 34 43 70 45C90 46.5 110 46.5 130 45C166 43 190 29 197 16Z" fill="#b07f55" opacity="0.55"/>
  <path d="M9 16C15 26 36 38 70 40C90 41.5 110 41.5 130 40C164 38 185 26 191 16Z" fill="url(#lama)"/>

  <!-- Água dentro da cova. -->
  <path d="M15 16C21 24 40 34 72 36C90 37 110 37 128 36C160 34 179 24 185 16Z" fill="url(#agua)"/>

  <!-- Reflexos do céu e pequenas ondulações. -->
  <path d="M34 22C52 24.5 70 25.5 88 25" fill="none" stroke="#e8f4ee" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M112 25C126 25 142 23.5 156 21" fill="none" stroke="#e8f4ee" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M72 31C86 32.5 104 32.5 118 31" fill="none" stroke="#d6ebe5" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <ellipse cx="130" cy="28" rx="9" ry="2" fill="none" stroke="#e8f4ee" stroke-width="1.5" opacity="0.45"/>
  <ellipse cx="130" cy="28" rx="4" ry="1" fill="#e8f4ee" opacity="0.45"/>

  <!-- Espelho d'água no nível do chão. -->
  <ellipse cx="100" cy="16.5" rx="84" ry="3.2" fill="#b9dcd6"/>
  <path d="M20 16.5C60 14.6 140 14.6 180 16.5" fill="none" stroke="url(#superficie)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Borda de lama molhada que corta a grama. -->
  <path d="M9 16C15 26 36 38 70 40C90 41.5 110 41.5 130 40C164 38 185 26 191 16" fill="none" stroke="#6e4b33" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Pedrinhas e tufos de grama nas margens, sobre o corte. -->
  <ellipse cx="22" cy="24" rx="3.2" ry="2.2" fill="#c7b9a6" stroke="#7b6a58" stroke-width="1"/>
  <ellipse cx="178" cy="25" rx="2.6" ry="1.9" fill="#c7b9a6" stroke="#7b6a58" stroke-width="1"/>
  <ellipse cx="156" cy="38.5" rx="2.2" ry="1.5" fill="#b8a993" stroke="#7b6a58" stroke-width="1"/>

  <path d="M2 17C6 15 11 14 16 16C14 11 10 7 6 6C10 9 12 12 11 14C9 10 6 9 2 9C5 11 6 13 6 15Z" fill="#78a65e" stroke="#4e754d" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M198 17C194 15 189 14 184 16C186 11 190 8 194 7C190 10 188 12 189 14C191 11 194 10 198 10C195 12 194 14 194 15Z" fill="#78a65e" stroke="#4e754d" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M30 15C31 11 33 9 35 8M34 15C35 12 37 11 39 11" fill="none" stroke="#5f8f52" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M168 15C167 11 165 9 163 8M164 15C163 12 161 11 159 11" fill="none" stroke="#5f8f52" stroke-width="1.6" stroke-linecap="round"/>
</svg>
